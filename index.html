<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Next Book</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- INTRODUCTION -->
        <section id="intro" class="screen active">
            <div class="book-icon">📖</div>

            <h1>Find Your Next Book</h1>

            <p class="subtitle">
                Not sure what to read next?
            </p>

            <p class="description">
                Answer a few questions about what you enjoy in stories,
                and discover a book that may be a good match for you.
            </p>

            <button id="startBtn" class="main-button">
                Start the quiz
            </button>
        </section>


        <!-- QUIZ -->
        <section id="quiz" class="screen">

            <div class="quiz-header">
                <span id="questionNumber">Question 1 of 6</span>

                <div class="progress-container">
                    <div id="progressBar"></div>
                </div>
            </div>

            <h2 id="question"></h2>

            <div id="answers" class="answers"></div>

            <button id="nextBtn" class="main-button next-button" disabled>
                Next
            </button>

        </section>


        <!-- RESULT -->
        <section id="result" class="screen">

            <div class="result-icon">✨</div>

            <p class="result-label">YOUR BOOK MATCH</p>

            <h1 id="bookTitle"></h1>

            <p id="bookAuthor" class="author"></p>

            <div class="book-description">
                <h3>Why this book?</h3>
                <p id="bookReason"></p>
            </div>

            <div class="book-about">
                <h3>About the book</h3>
                <p id="bookAbout"></p>
            </div>

            <button id="restartBtn" class="secondary-button">
                Take the quiz again
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
